# Static owner demo only. Public flags are not secrets.
[build]
  command = "npm run export:demo"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  EXPO_PUBLIC_APP_ENV = "demo"
  EXPO_PUBLIC_DEMO_AUTH = "0"
  EXPO_PUBLIC_DESIGN_SYSTEM = "0"

[build.processing.html]
  pretty_urls = true
